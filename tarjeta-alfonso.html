<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarjeta de Presentación — Alfonso Zavala</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Outfit:wght@300;500;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 60%, #a5d6a7 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
      padding: 24px;
      color: #1b5e20;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 28px;
      padding: 48px 36px;
      box-shadow: 0 28px 80px rgba(27, 94, 32, 0.15), 0 8px 24px rgba(27, 94, 32, 0.08);
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(27, 94, 32, 0.08);
    }

    .card::before {
      content: '';
      position: absolute;
      top: -60px; right: -60px;
      width: 220px; height: 220px;
      background: radial-gradient(circle, rgba(27,94,32,0.08) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .logo-area {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-area img {
      width: 160px;
      height: auto;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(27, 94, 32, 0.15);
      border: 1px solid rgba(27, 94, 32, 0.1);
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 800;
      font-size: 1.8rem;
      text-align: center;
      color: #1b5e20;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 6px;
    }

    h1 span {
      color: #2e7d32;
      display: block;
    }

    .tagline {
      text-align: center;
      font-size: 0.85rem;
      color: rgba(27, 94, 32, 0.7);
      margin-bottom: 28px;
      letter-spacing: 0.03em;
    }

    .divider {
      width: 48px;
      height: 3px;
      background: linear-gradient(90deg, #2e7d32, #66bb6a);
      border-radius: 100px;
      margin: 0 auto 28px;
    }

    .info-grid {
      display: grid;
      gap: 14px;
    }

    .info-item {
      background: rgba(27, 94, 32, 0.03);
      border: 1px solid rgba(27, 94, 32, 0.08);
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .info-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #2e7d32, #66bb6a);
      color: #fff;
      display: grid; place-items: center;
      font-size: 0.9rem;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(27, 94, 32, 0.25);
    }

    .info-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: rgba(27, 94, 32, 0.5);
      font-weight: 700;
    }

    .info-value {
      font-size: 0.95rem;
      color: #1b5e20;
      font-weight: 500;
      word-break: break-word;
    }

    .contact-link {
      color: #2e7d32;
      text-decoration: none;
      font-weight: 600;
      transition: color .2s;
    }
    .contact-link:hover { color: #1b5e20; text-decoration: underline; }

    .footer-note {
      text-align: center;
      margin-top: 28px;
      font-size: 0.75rem;
      color: rgba(27, 94, 32, 0.35);
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <article class="card" aria-label="Tarjeta de presentación Alfonso Zavala">
    <div class="logo-area">
      <img src="pinologo.png" alt="Logo Empaques y Tarimas El Pino">
    </div>

    <h1>Alfonso Zavala</h1>
    <p class="tagline">Empaques y Tarimas El Pino · Uruapan, Michoacán</p>

    <div class="divider"></div>

    <div class="info-grid">
      <div class="info-item" aria-label="Correo">
        <div class="info-icon" aria-hidden="true">✉</div>
        <div>
          <div class="info-label">Correo</div>
          <div class="info-value"><a href="mailto:ponchozavala@yahoo.com.mx" class="contact-link">ponchozavala@yahoo.com.mx</a></div>
        </div>
      </div>

      <div class="info-item" aria-label="Sitio web">
        <div class="info-icon" aria-hidden="true">🌐</div>
        <div>
          <div class="info-label">Sitio Web</div>
          <div class="info-value"><a href="https://empaquesytarimaselpino.github.io/landing-movil/" class="contact-link" target="_blank" rel="noopener">empaquesytarimaselpino.github.io</a></div>
        </div>
      </div>

      <div class="info-item" aria-label="Ubicación">
        <div class="info-icon" aria-hidden="true">📍</div>
        <div>
          <div class="info-label">Ubicación</div>
          <div class="info-value">Uruapan, Michoacán</div>
        </div>
      </div>
    </div>

    <p class="footer-note">Empresa líder en producción y venta de madera · Atención nacional</p>
  </article>
</body>
</html>
